name: Backfill demo video

on:
  pull_request:
    paths:
      - 'demo-video/**'
      - 'docs/hackathon-submission-checklist.md'
      - '.github/workflows/demo-video.yml'
  push:
    branches:
      - main
    paths:
      - 'demo-video/**'
      - 'docs/hackathon-submission-checklist.md'
      - '.github/workflows/demo-video.yml'
  workflow_dispatch:

jobs:
  verify-demo-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-video
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck and bundle
        run: npm run verify

      - name: Render final demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run render

      - name: Upload rendered demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-demo-video
          path: demo-video/out/backfill-demo.mp4
          if-no-files-found: error
          retention-days: 14

name: strands-smoke
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python scripts/strands_smoke_harness.py
      - name: Verify committed checksum manifest
        run: sha256sum -c SHA256SUMS.txt
      - name: Record E3 proof
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          VERSION=$(python -c 'import importlib.metadata as m; print(m.version("strands-agents"))')
          gh pr comment "$PR_URL" --body "E3_CI_PASS commit=$GITHUB_SHA strands-agents=$VERSION python=$(python --version 2>&1) run_id=$GITHUB_RUN_ID"

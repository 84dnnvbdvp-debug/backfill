<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Backfill architecture</title>
  <desc id="desc">Business owner and waitlist clients interact through a Strands orchestration layer and a deterministic Backfill application, with durable state plus Calendar and Gmail adapters. Evidence levels E2 through E4 are shown separately.</desc>
  <rect x="20" y="20" width="1160" height="610" fill="white" stroke="black"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="black" stroke="black">
    <rect x="55" y="90" width="180" height="70" fill="white" rx="8"/>
    <text x="145" y="118" text-anchor="middle" stroke="none" font-size="16">Business owner</text>
    <text x="145" y="142" text-anchor="middle" stroke="none" font-size="13">policy authority</text>

    <rect x="330" y="70" width="235" height="105" fill="white" rx="8"/>
    <text x="447" y="100" text-anchor="middle" stroke="none" font-size="16">Strands Agents SDK</text>
    <text x="447" y="124" text-anchor="middle" stroke="none" font-size="13">custom Model + @tool</text>
    <text x="447" y="148" text-anchor="middle" stroke="none" font-size="13">BeforeToolCall interrupt / resume</text>

    <rect x="660" y="55" width="300" height="135" fill="white" rx="8"/>
    <text x="810" y="85" text-anchor="middle" stroke="none" font-size="16">Deterministic BackfillApplication</text>
    <text x="810" y="110" text-anchor="middle" stroke="none" font-size="13">eligibility • order • policy • idempotency</text>
    <text x="810" y="134" text-anchor="middle" stroke="none" font-size="13">booking verification • terminal state</text>
    <text x="810" y="158" text-anchor="middle" stroke="none" font-size="13">recovered-value accounting</text>

    <rect x="995" y="90" width="160" height="70" fill="white" rx="8"/>
    <text x="1075" y="118" text-anchor="middle" stroke="none" font-size="16">Waitlist clients</text>
    <text x="1075" y="142" text-anchor="middle" stroke="none" font-size="13">offer / reply / confirm</text>

    <rect x="655" y="255" width="305" height="90" fill="white" rx="8"/>
    <text x="807" y="285" text-anchor="middle" stroke="none" font-size="16">Durable workflow state / audit</text>
    <text x="807" y="312" text-anchor="middle" stroke="none" font-size="13">offer intent • outbox • ledger</text>

    <rect x="330" y="260" width="235" height="115" fill="white" rx="8"/>
    <text x="447" y="290" text-anchor="middle" stroke="none" font-size="16">Calendar adapter</text>
    <text x="447" y="315" text-anchor="middle" stroke="none" font-size="13">deterministic booking key / event ID</text>
    <text x="447" y="339" text-anchor="middle" stroke="none" font-size="13">create → readback → verify</text>
    <text x="447" y="363" text-anchor="middle" stroke="none" font-size="13">reconcile ambiguous outcomes</text>

    <rect x="995" y="260" width="160" height="115" fill="white" rx="8"/>
    <text x="1075" y="290" text-anchor="middle" stroke="none" font-size="16">Gmail adapter</text>
    <text x="1075" y="315" text-anchor="middle" stroke="none" font-size="13">X-Backfill-Token</text>
    <text x="1075" y="339" text-anchor="middle" stroke="none" font-size="13">durable outbox</text>
    <text x="1075" y="363" text-anchor="middle" stroke="none" font-size="13">reconcile before resend</text>

    <rect x="255" y="455" width="690" height="120" fill="white" stroke-dasharray="7 5" rx="8"/>
    <text x="600" y="485" text-anchor="middle" stroke="none" font-size="16">Evidence boundary</text>
    <text x="600" y="512" text-anchor="middle" stroke="none" font-size="13">E2: mocks / fixtures  →  E3: clean real Strands runtime  →  E4: authorized provider mutation + readback</text>
    <text x="600" y="540" text-anchor="middle" stroke="none" font-size="13">No AgentCore / Bedrock deployment claimed</text>

    <g fill="none" stroke-width="2">
      <path d="M235 125 H330"/><path d="M565 125 H660"/><path d="M960 125 H995"/>
      <path d="M810 190 V255"/><path d="M660 145 C610 165 590 230 565 290"/>
      <path d="M960 145 C1000 180 1025 225 1045 260"/>
      <path d="M995 325 H960"/><path d="M565 325 H655"/>
      <path d="M1040 260 C1000 225 970 205 930 185"/>
      <path d="M447 260 C500 220 570 195 660 165"/>
    </g>
  </g>
</svg>
